[package]
name = "age-plugin-pq"
version.workspace = true
description = "age plugin providing post-quantum hybrid ML-KEM-768 + X25519 recipients, usable with any age implementation that supports the plugin protocol. Developed alongside the encrypted-file-vault project; not published to crates.io."
repository.workspace = true
keywords = ["age", "encryption", "post-quantum", "mlkem", "x25519"]
categories = ["cryptography"]

publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

include.workspace = true

[dependencies]
age-plugin = "0.6"
age-core = "0.11"
age-pq-hpke = { path = "../age-pq-hpke" }
chacha20poly1305 = "0.10"
base64 = "0.22"
clap = { workspace = true }
# `sys_rng` (the rand 0.10 name for the old `os_rng`) is a default feature and
# supplies `rngs::SysRng`; `std` is requested explicitly as before.
rand = { version = "0.10", features = ["std"] }
# Inherit the workspace entry so its `< 0.3.46` MSRV cap governs here too;
# declaring `time = "0.3"` locally used to bypass that cap entirely.
time = { workspace = true, features = ["formatting"] }
secure-gate = { workspace = true, features = ["encoding-bech32", "std"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

[[bin]]
name = "age-plugin-pq"
path = "src/main.rs"
