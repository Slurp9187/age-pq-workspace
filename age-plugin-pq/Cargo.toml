[package]
name = "age-plugin-pq"
version = "0.0.2"
description = "age plugin providing post-quantum hybrid ML-KEM-768 + X25519 recipients, usable with any age implementation that supports the plugin protocol. Developed alongside the encrypted-file-vault project; not published to crates.io."
repository.workspace = true
keywords = ["age", "encryption", "post-quantum", "mlkem", "x25519"]
categories = ["cryptography"]

publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

include.workspace = true

[dependencies]
age-plugin = "0.6"
age-core = "0.11"
age-pq-hpke = { path = "../age-pq-hpke" }
chacha20poly1305 = "0.10"
base64 = "0.22"
bech32 = "0.11"
clap = { workspace = true }
rand = { version = "0.9", features = ["std"] }
time = { version = "0.3", features = ["formatting"] }
secure-gate = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[[bin]]
name = "age-plugin-pq"
path = "src/main.rs"
