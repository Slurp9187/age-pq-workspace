[package]
name = "age-pq-keys"
version.workspace = true
repository.workspace = true
description = "age recipient and identity types for post-quantum hybrid encryption: keypair generation, the bech32 key formats, and the mlkem768x25519 stanza. Developed for the encrypted-file-vault project; not published to crates.io."

publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
include.workspace = true

[dependencies]
age-pq-hpke = { path = "../age-pq-hpke" }
age = "0.11"
age-core = "0.11"
base64 = "0.22"
secure-gate = { workspace = true, features = ["encoding-bech32", "std"] }

[dev-dependencies]
# Dev-deps inherit the workspace entries so one place governs them. The exact
# pins these used to carry were MSRV-1.70 scaffolding and are gone; the
# workspace Cargo.lock remains the reproducibility guard.
proptest = { workspace = true }
# CCTV testkit conformance harness: `armor` for the armored vector, `sha2` for
# payload digests. Both resolve to already-locked versions (no new fetch).
age = { version = "0.11", features = ["armor"] }
sha2 = "0.10"
tempfile = { workspace = true }
time = { workspace = true }
clap = { workspace = true }

[lints]
workspace = true

[[example]]
name = "pq-keygen"
path = "examples/pq-keygen.rs"
