[package]
name = "age-pq-hpke"
version.workspace = true
repository.workspace = true
description = "Post-quantum hybrid X-Wing KEM (ML-KEM-768 + X25519) and HPKE key schedule (RFC 9180 + draft-ietf-hpke-pq), with ML-KEM supplied by the formally verified libcrux. Developed for the encrypted-file-vault project; not published to crates.io."
keywords = ["post-quantum", "cryptography", "hybrid", "ML-KEM", "X25519"]
categories = ["cryptography"]

publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
include.workspace = true

[features]
default = ["mlkem768"]
mlkem768 = ["libcrux-ml-kem/mlkem768"]
mlkem512 = ["libcrux-ml-kem/mlkem512"]
mlkem1024 = ["libcrux-ml-kem/mlkem1024"]

[dependencies]
# Cryptographic dependencies - pinned to specific versions for security and reproducibility
# default-features = false selects the ML-KEM variant explicitly: the default
# feature set turns on mlkem512 and mlkem1024 as well, and this crate's own
# `mlkem512` / `mlkem1024` features exist to forward that choice. (The previous
# comment here blamed "older Cargo" and its tls_codec default-feature
# resolution; that was a Cargo-1.70 rationale and is stale at 1.85. The flag
# stays for the reason above.)
#
# Held at 0.0.10 under the 1.87 floor. 0.0.11 pins `libcrux-platform =0.0.4`,
# which calls `core::arch` `__cpuid` outside an `unsafe` block and so fails to
# compile (E0133) on 1.87, where `__cpuid` is still an unsafe fn. Neither crate
# declares a `rust-version`, so resolver 3 cannot see it. Measured in the
# `0.2.0-rc.7` recency sweep: 1.93 fails, 1.94 builds (`__cpuid` became safe
# there). Upstream: celabshq/libcrux#1646. Wrapping the three calls in
# `unsafe {}` under `#[allow(unused_unsafe)]` builds on 1.87 too, so move when
# a libcrux-ml-kem release pins a fixed libcrux-platform, or when the floor
# reaches 1.94.
libcrux-ml-kem = { version = "0.0.10", default-features = false, features = ["mlkem768", "rand"] }
# `zeroize` (new in 0.10.9) wipes the Keccak state on drop; it absorbs the
# X-Wing combiner input and the SHAKE KDF's secrets.
sha3 = { version = "0.10.9", default-features = false, features = ["zeroize"] }

x25519-dalek = { version = "2.0", default-features = false, features = ["zeroize", "static_secrets"] }
x448 = "0.6.0"

thiserror = "2.0"
# rand 0.10: `os_rng` -> `sys_rng`, `OsRng` -> `SysRng`, and rand_core renamed
# `RngCore` -> `Rng` / `TryRngCore` -> `TryRng`. `sys_rng` is on by default.
# `rand_core` moved to [dev-dependencies]: nothing in `src/` names it, and
# rand_core 0.10 has no features at all (the `os_rng` feature it used to carry
# was removed along with `OsRng` itself).
rand = "0.10"
chacha20poly1305 = "0.10"
# Feature-only dependencies: nothing in `src/` names these crates. They exist to
# turn on `zeroize` where no dependency forwards it, and Cargo's feature
# unification applies it to every build that links this crate.
# - poly1305: chacha20poly1305 0.10 enables `zeroize` on chacha20 but not on
#   poly1305, so the one-time MAC key (r, s) and accumulator survived drop.
# - chacha20 0.10: rand 0.10's ChaCha RNG core (`std_rng` / `thread_rng`,
#   also pulled by libcrux-ml-kem through rand). We draw from `SysRng`, but
#   the core is compiled in and anything using `rand::rng()` keeps state there.
# Keep their majors in step with chacha20poly1305 and rand, or the feature
# lands on a version nothing else uses and wipes nothing.
poly1305 = { version = "0.8", default-features = false, features = ["zeroize"] }
chacha20 = { version = "0.10", default-features = false, features = ["zeroize"] }
aead = { version = "0.5", default-features = false }
byteorder = "1.5"
hkdf = "0.12"
sha2 = "0.10"

secure-gate = { workspace = true }
# Direct, not via secure-gate: libcrux-ml-kem 0.0.10 has no zeroize support, so
# the expanded ML-KEM private key is wiped from this side (`ml_kem::WipingKeyPair`).
# secure-gate re-exports `zeroize` only from its semver-exempt `__private`
# module. Already in the graph at 1.8.x through secure-gate and x25519-dalek;
# this adds an edge, not a crate.
zeroize = { version = "1.8", default-features = false }

[dev-dependencies]
rand = "0.10"
rand_chacha = "0.10"
rand_core = "0.10"
serde = { version = "1.0", features = ["derive"] }
# Was `=1.0.132`, a leftover of blanket exact-pin style with no recorded reason;
# serde_json declares 1.71, well under the floor.
serde_json = "1.0"

[lints]
workspace = true
