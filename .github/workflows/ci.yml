name: CI

# NOTE ON LOCATION: this file must live at the *repository root*
# (.github/workflows/). GitHub Actions does not read workflow files from
# subdirectories. An earlier copy sat at age-pq-hpke/.github/workflows/ci.yml
# and therefore never ran a single time — which is how a set of input-validation
# defects (see docs/design/cctv-conformance.md) survived undetected.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # str4d/rage @ pq, "Default to `pq` identities" (2026-08-20). The second
  # differential oracle; see the rage steps in the msrv job for why this is a
  # commit rather than a branch name.
  RAGE_PIN: 5d33e3e51975e4e96a982ba7e30fe1c72db506fe

jobs:
  msrv:
    name: MSRV (1.85) — workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are required by the changelog check below: without them every
          # dated section looks untagged and the check fails for the wrong
          # reason. actions/checkout fetches none by default.
          fetch-depth: 0
      # ---- changelog protocol -------------------------------------------
      # Two invariants, both silent failures otherwise:
      #   * the top changelog section matches the manifest version
      #   * a version heading is dated IFF that tag exists
      # A section reading `## [1.2.0] - 2026-09-10` when v1.2.0 was never
      # tagged claims a release that did not happen, and reads that way
      # forever. That exact state existed on this branch before the check did.
      # Protocol and rationale: .claude/skills/changelog-protocol/SKILL.md
      - name: Changelog protocol
        run: python .claude/skills/changelog-protocol/scripts/check_changelog.py
      # Keep this in step with rust-toolchain.toml, which pins the same version
      # and is what every bare `cargo` in this repo actually obeys.
      - uses: dtolnay/rust-toolchain@1.85
        with:
          components: rustfmt, clippy
      # ---- formatting and lints (issue #2) --------------------------------
      # Neither of these was in CI before the 1.85 bump. Both were run by hand
      # on every change and believed to be upheld, which is the same shape as
      # every other defect this repository has had to dig out: a standard with
      # no verifier behind it. The edition-2024 move proved the point — rustfmt's
      # style edition reorders `use` groups, so 27 files were left unformatted
      # and nothing in CI would ever have said so.
      #
      # `--check` rather than a reformat: CI reports, it does not rewrite.
      - run: cargo fmt --all -- --check
      # `--all-features` deliberately. The workspace lint table added in this
      # bump surfaced `unreachable_pub` items that only compile under the
      # non-default mlkem512/mlkem1024 features, so a default-feature clippy
      # run would have passed over them.
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings
      # The `cargo update -p half --precise 2.4.1` step that used to sit here is
      # gone with the 1.85 bump. It was holding half below 2.5 (which needs
      # 1.81), and `half` has since left the dependency graph altogether — it
      # arrived via secure-gate's 0.8 backport line. Left in place the step
      # would not merely be redundant, it would FAIL: `cargo update -p` errors
      # out on a package that is not in the graph, taking the job down before
      # either oracle guard ran.
      - run: cargo check --workspace --all-targets
      # ---- differential-oracle anti-gutting guard, part 1 (issue #15) ------
      # A test target with zero #[test] fns prints "running 0 tests ... ok" and
      # EXITS 0 (measured, not assumed). A CI step that merely names the file
      # therefore catches deletion but not gutting. This step asserts on a count.
      #
      #   deleted  -> `cargo test --test <t>` exits 101, "no test target named"
      #   removed  -> the --list summary drops below the floor
      #
      # What it CANNOT see (measured, both):
      #   * bodies replaced by `{}` — --list counts names, not work
      #   * tests all re-#[ignore]d — --list counts ignored tests too
      # Part 2 below is what catches those. Do not add claims here that this
      # step does not actually make.
      #
      # Selection matches the workspace test step deliberately. `-p age-pq-keys`
      # resolves a DIFFERENT feature set (libcrux-ml-kem {mlkem768,rand} vs
      # {mlkem512,mlkem768,mlkem1024,rand} under --all-features), which links a
      # different test binary and, with no build cache here, pays a second cold
      # libcrux-ml-kem + age-pq-hpke + age-pq-keys build. With --workspace
      # --all-features this step is a strict prefix of work the run needs anyway.
      #
      # It sits before the age installer only because it needs no binary — not
      # to "fail fast": this is the step that pays the cold test-profile build
      # (minutes), while the installer takes seconds.
      #
      # Three deliberate choices, each measured:
      #   * NO `-q`. `cargo test -q -- --list` suppresses the summary line
      #     entirely, so a quiet guard sees an empty string for BOTH a healthy
      #     and a gutted target — a vacuous pass.
      #   * sed, not grep. grep exits 1 on zero matches, and the reflex repair
      #     `|| true` converts a libtest format change into a silent pass. sed
      #     exits 0 with empty output, which the -z test below turns into a
      #     named failure. No path here passes without a number.
      #   * `--color never`, because the job sets CARGO_TERM_COLOR: always.
      - name: Oracle guard — declared test count
        shell: bash
        run: |
          set -euo pipefail
          TARGET=differential_age_go
          MIN_TESTS=7
          # This is the first step that links a test binary (`cargo check` above
          # produces no linkable rlibs), so it is the most likely place for a
          # codegen or link failure to surface. Keep the diagnostics: they are
          # printed on failure and kept out of the success path so `sed` only
          # ever sees the --list summary.
          err="$(mktemp)"
          if ! listing="$(cargo test --workspace --all-features --test "$TARGET" \
                            -- --list --color never 2>"$err")"; then
            cat "$err"
            echo "::error::test target '$TARGET' is missing or does not build"
            exit 1
          fi
          declared="$(printf '%s\n' "$listing" \
            | sed -n 's/^\([0-9][0-9]*\) tests\?, [0-9][0-9]* benchmarks$/\1/p')"
          if [ -z "$declared" ]; then
            echo "::error::could not parse the libtest --list summary for '$TARGET'"
            printf '%s\n' "$listing"
            exit 1
          fi
          echo "$TARGET declares $declared test(s); floor is $MIN_TESTS"
          if [ "$declared" -lt "$MIN_TESTS" ]; then
            echo "::error::'$TARGET' declares $declared test(s), below the floor of $MIN_TESTS"
            exit 1
          fi
      # Interop tests are #[ignore]d so a normal `cargo test` reports them as
      # ignored rather than silently passing when the binary is absent. CI runs
      # them explicitly via --include-ignored, where a missing age is a hard
      # failure. The installer is shared with developers rather than duplicated
      # here; it pins the version and verifies a sha256.
      - name: Install age CLI
        run: sudo ./scripts/install-age.sh
      # ---- the second oracle: rage (issue #15) ----------------------------
      # `tests/differential_rage.rs` needs a rage that implements
      # mlkem768x25519, which lives only on str4d/rage's `pq` branch — there is
      # no tagged release to install, so it is built from source here.
      #
      # **Pinned to a commit, not to the branch.** `pq` is in flight; tracking
      # the tip would mean a green run today and a red one tomorrow for reasons
      # outside this repository, and "our oracle moved" is indistinguishable
      # from "we regressed" in that log. Bumping this SHA is a deliberate,
      # reviewable act. The tree is cached on it, so only the first run after a
      # bump pays the build.
      #
      # This is NOT optional scaffolding: the test step below runs the whole
      # suite with --include-ignored, and the rage differentials fail loudly if
      # the binaries are absent. That is the same contract age has here, and it
      # is deliberate — a second oracle that silently stops running is worth
      # less than no second oracle, because it still reads as coverage.
      - name: Cache the rage oracle build
        id: rage-cache
        uses: actions/cache@v4
        with:
          path: ~/rage-oracle
          key: rage-oracle-${{ env.RAGE_PIN }}-${{ runner.os }}
      - name: Build rage (pq branch) as the second oracle
        if: steps.rage-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          rm -rf ~/rage-src
          git clone --filter=blob:none --no-checkout https://github.com/str4d/rage.git ~/rage-src
          git -C ~/rage-src fetch --depth 1 origin "$RAGE_PIN"
          git -C ~/rage-src checkout --detach "$RAGE_PIN"
          cargo build --manifest-path ~/rage-src/Cargo.toml --release --bin rage --bin rage-keygen
          mkdir -p ~/rage-oracle
          cp ~/rage-src/target/release/rage ~/rage-src/target/release/rage-keygen ~/rage-oracle/
      - name: Point the oracle at the rage build
        run: |
          set -euo pipefail
          echo "RAGE_BIN=$HOME/rage-oracle/rage" >> "$GITHUB_ENV"
          echo "RAGE_KEYGEN_BIN=$HOME/rage-oracle/rage-keygen" >> "$GITHUB_ENV"
          # Proves the cached-or-fresh binary is pq-capable before the suite
          # runs, so a cache poisoned with a non-pq build fails here — naming
          # the cause — rather than inside a differential.
          "$HOME/rage-oracle/rage-keygen" --version
          "$HOME/rage-oracle/rage-keygen" | grep -q '^# public key: age1pq' \
            || { echo "::error::the cached rage does not produce age1pq recipients"; exit 1; }
      - run: cargo test --workspace --all-features -- --include-ignored
      # ---- rage-oracle anti-gutting guard (issue #15) ----------------------
      # The same reasoning as the age-go guards, applied to the second oracle:
      # the suite step above would stay green if every rage body were voided,
      # and an all-#[ignore]d file reports `ok` too. A banner is printed only
      # after `require_rage_cli` spawned the binary AND `require_rage_pq_support`
      # proved it speaks mlkem768x25519, so its presence is positive evidence
      # that real work ran against a real rage.
      - name: Oracle guard — rage differentials actually executed
        shell: bash
        run: |
          set -euo pipefail
          TARGET=differential_rage
          MIN_PASSED=6
          if ! out="$(cargo test --workspace --all-features --test "$TARGET" \
                        -- --include-ignored --nocapture --test-threads=1 \
                           --color never 2>&1)"; then
            printf '%s\n' "$out"
            echo "::error::'$TARGET' failed"
            exit 1
          fi
          printf '%s\n' "$out"
          result="$(printf '%s\n' "$out" | sed -n '/^test result: /p' | tail -n 1)"
          passed="$(printf '%s\n' "$result" | sed -n 's/^test result: [A-Za-z]*\. \([0-9][0-9]*\) passed.*/\1/p')"
          if [ -z "$passed" ]; then
            echo "::error::could not parse the libtest result line for '$TARGET'"
            printf 'line was: %s\n' "$result"
            exit 1
          fi
          echo "$TARGET: $passed passed (floor: $MIN_PASSED)"
          if [ "$passed" -lt "$MIN_PASSED" ]; then
            echo "::error::only $passed test(s) ran in '$TARGET'; floor is $MIN_PASSED"
            exit 1
          fi
          for r in R1 R2 R3 R4 R5; do
            if ! printf '%s\n' "$out" | grep -Fq "$r: "; then
              echo "::error::'$TARGET' printed no $r banner; that body ran nothing against rage"
              exit 1
            fi
          done
          echo "$TARGET: all five rage differential banners present"
      # ---- differential-oracle anti-gutting guard, part 2 (issue #15) ------
      # Part 1 counts DECLARED tests and is blind to two cheap ways of gutting
      # this file. Both were measured against a real mutation, not reasoned
      # about: #[test] fns keeping their names with every body replaced by `{}`
      # report "N passed, 0 ignored" in 0.00s, and adding #[ignore] to all of
      # them leaves --list unchanged. A count-shaped guard is green on both.
      #
      # So this step asserts on EVIDENCE A BODY MUST PRODUCE, plus two counts:
      #
      #   body voided   -> no `D1:`..`D5:` banner is printed (each is emitted
      #                    only after require_age_cli() spawned the binary, so a
      #                    banner is positive proof the CLI ran)
      #   re-#[ignore]d -> no banner either, AND the plain run below (no
      #                    --include-ignored) drops to 0 passed
      #   deleted/dead  -> cargo exits 101 and the output is echoed
      #
      # An earlier version of this step checked `ignored -ne 0` instead. That
      # branch was unreachable: under --include-ignored libtest always reports
      # `ignored: 0`. Hence the second, plain invocation — the only way an
      # ignored-count assertion means anything.
      #
      # `--test-threads=1` so the threads cannot splice a banner line;
      # `--nocapture` so banners reach stdout at all. The whole target runs in
      # ~2.4 s, so serialising it costs nothing. Selection matches the workspace
      # step for the feature-resolution reason spelled out in part 1: this
      # re-runs the target the --workspace line already ran, which is duplicate
      # EXECUTION (seconds), not duplicate compilation.
      - name: Oracle guard — cases actually executed
        shell: bash
        run: |
          set -euo pipefail
          TARGET=differential_age_go
          MIN_PASSED=7
          MIN_PLAIN_PASSED=2   # the two guard tests that need no age binary
          if ! out="$(cargo test --workspace --all-features --test "$TARGET" \
                        -- --include-ignored --nocapture --test-threads=1 \
                           --color never 2>&1)"; then
            printf '%s\n' "$out"
            echo "::error::'$TARGET' failed"
            exit 1
          fi
          printf '%s\n' "$out"
          result="$(printf '%s\n' "$out" | sed -n '/^test result: /p' | tail -n 1)"
          pattern='s/^test result: [A-Za-z]*\. \([0-9][0-9]*\) passed; [0-9][0-9]* failed; [0-9][0-9]* ignored.*/'
          passed="$(printf '%s\n' "$result" | sed -n "${pattern}\1/p")"
          if [ -z "$passed" ]; then
            echo "::error::could not parse the libtest result line for '$TARGET'"
            printf 'line was: %s\n' "$result"
            exit 1
          fi
          echo "$TARGET: $passed passed (floor: $MIN_PASSED)"
          if [ "$passed" -lt "$MIN_PASSED" ]; then
            echo "::error::only $passed test(s) ran in '$TARGET'; floor is $MIN_PASSED"
            exit 1
          fi
          # Match the differential name only, never the version substring: CI
          # installs v1.3.2 and local development is on v1.3.1.
          for d in D1 D2 D3 D4 D5; do
            if ! printf '%s\n' "$out" | grep -Fq "$d: "; then
              echo "::error::'$TARGET' printed no $d banner; that body ran nothing against the age CLI"
              exit 1
            fi
          done
          echo "$TARGET: all five differential banners present"
          # Second, plain invocation: nothing is rebuilt, and it is the only
          # check that can see an all-#[ignore]d file (which would otherwise
          # still be green here and run nothing on a developer's `cargo test`).
          if ! plain="$(cargo test --workspace --all-features --test "$TARGET" \
                          -- --color never 2>&1)"; then
            printf '%s\n' "$plain"
            echo "::error::'$TARGET' failed without --include-ignored"
            exit 1
          fi
          plain_result="$(printf '%s\n' "$plain" | sed -n '/^test result: /p' | tail -n 1)"
          plain_passed="$(printf '%s\n' "$plain_result" | sed -n "${pattern}\1/p")"
          if [ -z "$plain_passed" ]; then
            echo "::error::could not parse the plain libtest result line for '$TARGET'"
            printf 'line was: %s\n' "$plain_result"
            exit 1
          fi
          echo "$TARGET: $plain_passed test(s) run without --include-ignored (floor: $MIN_PLAIN_PASSED)"
          if [ "$plain_passed" -lt "$MIN_PLAIN_PASSED" ]; then
            echo "::error::only $plain_passed test(s) in '$TARGET' run without --include-ignored; the binary-free guards must not be #[ignore]d"
            exit 1
          fi

  cctv:
    name: C2SP CCTV hybrid vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      # Run the vectors as their own job so a regression is legible at a glance
      # rather than buried in the workspace suite.
      - run: cargo test -p age-pq-keys --test testkit -- --nocapture

  conformance:
    name: In-process differentials vs rage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
        with:
          components: rustfmt, clippy
      # `conformance/` is excluded from the root workspace and has its own
      # lockfile, so it needs its own cache and its own cargo invocations. The
      # key is the lockfile: it pins rage, the two str4d forks, and everything
      # under them, so a cache hit is a build of exactly the same graph.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            conformance/target
          key: conformance-${{ runner.os }}-${{ hashFiles('conformance/Cargo.lock') }}
          restore-keys: conformance-${{ runner.os }}-
      # `--locked` is the point of committing conformance/Cargo.lock: this job
      # must fail if resolution drifts rather than silently testing a different
      # rage. The lockfile is the pin.
      - name: Verify the lockfile still resolves exactly
        working-directory: conformance
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: fmt
        working-directory: conformance
        run: cargo fmt -- --check
      - name: clippy
        working-directory: conformance
        run: cargo clippy --locked --all-targets -- -D warnings
      # No --include-ignored: nothing here is #[ignore]d. rage is a *library*
      # dependency in this workspace, so there is no binary to be absent and no
      # reason to gate on one — the tests either compile against rage or the job
      # fails to build, which is a louder failure than a skip.
      - name: In-process differentials
        working-directory: conformance
        run: cargo test --locked -- --nocapture --test-threads=1
      # ---- anti-gutting guard --------------------------------------------
      # Same reasoning as the two shell-out oracles: the step above stays green
      # if every body is voided. A banner is printed from inside a test body, so
      # its presence is evidence the body ran.
      - name: Guard — in-process differentials actually executed
        working-directory: conformance
        shell: bash
        run: |
          set -euo pipefail
          MIN_PASSED=4
          out="$(cargo test --locked -- --nocapture --test-threads=1 --color never 2>&1)"
          printf '%s\n' "$out"
          result="$(printf '%s\n' "$out" | sed -n '/^test result: /p' | sed -n '2p')"
          passed="$(printf '%s\n' "$result" | sed -n 's/^test result: [A-Za-z]*\. \([0-9][0-9]*\) passed.*/\1/p')"
          if [ -z "$passed" ]; then
            echo "::error::could not parse the libtest result line"
            printf 'line was: %s\n' "$result"
            exit 1
          fi
          echo "in-process: $passed passed (floor: $MIN_PASSED)"
          if [ "$passed" -lt "$MIN_PASSED" ]; then
            echo "::error::only $passed test(s) ran; floor is $MIN_PASSED"
            exit 1
          fi
          for p in P1 P2 P3; do
            if ! printf '%s\n' "$out" | grep -Fq "$p: "; then
              echo "::error::no $p banner; that body ran nothing against rage"
              exit 1
            fi
          done
          echo "in-process: all three differential banners present"
