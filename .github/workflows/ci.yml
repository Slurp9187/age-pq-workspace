name: CI

# NOTE ON LOCATION: this file must live at the *repository root*
# (.github/workflows/). GitHub Actions does not read workflow files from
# subdirectories. An earlier copy sat at age-hpke-pq/.github/workflows/ci.yml
# and therefore never ran a single time — which is how a set of input-validation
# defects (see docs/design/cctv-conformance.md) survived undetected.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: MSRV (1.70) — workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.70
      # half 2.5+ requires rustc 1.81; pin it back to hold the 1.70 MSRV.
      - run: cargo update -p half --precise 2.4.1
      - run: cargo check --workspace --all-targets
      # The interop tests need age >= 1.3.0 (first release with native
      # post-quantum support). Ubuntu's packaged age is far older, so fetch the
      # release binary. AGE_INTEROP_REQUIRED below turns a missing binary into a
      # failure -- without it those tests skip, and a skipped test reports as
      # passed, which is how this suite stayed green without running.
      - name: Install age CLI
        env:
          AGE_VERSION: v1.3.2
          # sha256 of age-v1.3.2-linux-amd64.tar.gz. Verified rather than piped
          # straight into tar: this binary decrypts test material, so a swapped
          # release would be executing attacker code inside CI.
          AGE_SHA256: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
        run: |
          set -euo pipefail
          curl -sSLf -o age.tar.gz             "https://github.com/FiloSottile/age/releases/download/${AGE_VERSION}/age-${AGE_VERSION}-linux-amd64.tar.gz"
          echo "${AGE_SHA256}  age.tar.gz" | sha256sum -c -
          tar -xzf age.tar.gz
          sudo install -m 0755 age/age /usr/local/bin/age
          age --version
      - run: cargo test --workspace --all-features
        env:
          AGE_INTEROP_REQUIRED: "1"

  conformance:
    name: C2SP CCTV hybrid vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.70
      - run: cargo update -p half --precise 2.4.1
      # Run the vectors as their own job so a regression is legible at a glance
      # rather than buried in the workspace suite.
      - run: cargo test -p age-recipient-pq --test testkit -- --nocapture
