name: CI

# NOTE ON LOCATION: this file must live at the *repository root*
# (.github/workflows/). GitHub Actions does not read workflow files from
# subdirectories. An earlier copy sat at age-pq-hpke/.github/workflows/ci.yml
# and therefore never ran a single time — which is how a set of input-validation
# defects (see docs/design/cctv-conformance.md) survived undetected.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: MSRV (1.70) — workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.70
      # half 2.5+ requires rustc 1.81; pin it back to hold the 1.70 MSRV.
      - run: cargo update -p half --precise 2.4.1
      - run: cargo check --workspace --all-targets
      # Interop tests are #[ignore]d so a normal `cargo test` reports them as
      # ignored rather than silently passing when the binary is absent. CI runs
      # them explicitly via --include-ignored, where a missing age is a hard
      # failure. The installer is shared with developers rather than duplicated
      # here; it pins the version and verifies a sha256.
      - name: Install age CLI
        run: sudo ./scripts/install-age.sh
      - run: cargo test --workspace --all-features -- --include-ignored

  conformance:
    name: C2SP CCTV hybrid vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.70
      - run: cargo update -p half --precise 2.4.1
      # Run the vectors as their own job so a regression is legible at a glance
      # rather than buried in the workspace suite.
      - run: cargo test -p age-pq-keys --test testkit -- --nocapture
