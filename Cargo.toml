[workspace]
members = ["age-pq-hpke", "age-pq-keys", "age-plugin-pq"]
# `conformance/` is deliberately NOT a member. It links rage, whose `age`
# crate cannot coexist with crates.io `age 0.12` in one graph (their `ml-kem`
# generations pin incompatible exact versions of the pre-release `kem` crate),
# and it carries `[patch.crates-io]` entries that would otherwise apply to the
# shipped crates. `exclude` keeps `cargo test --workspace` from reaching it and
# gives it its own lockfile. See conformance/Cargo.toml for the measurements.
exclude = ["conformance"]
resolver = "3"   # MSRV 1.85 → resolver 3 (MSRV-aware selection). Requires Cargo 1.84+.

# Shared package metadata (inherited by every member)
[workspace.package]
# Experimental crates, distributed by git tag. Never published to crates.io, and
# `publish = false` makes that a hard error rather than a convention: `cargo
# publish` and `cargo package --list` refuse instead of half-succeeding.
publish = false

# One version for all three crates. They are one release: `age-pq-keys` layers
# on `age-pq-hpke` and `age-plugin-pq` exposes `age-pq-keys`, distribution is a
# single git tag over the whole workspace, and a consumer pinning
# `tag = "v0.2.0-rc.1"` gets all three at once. Per-crate numbers would give
# that tag three answers to "which version is this?".
version = "0.2.0-rc.3"

rust-version = "1.85"
edition = "2024"
# Confirmed against the LICENSE-MIT / LICENSE-APACHE files in the repository
# root and in each crate, not assumed: dual MIT / Apache-2.0, at the user's
# option, which is the Rust ecosystem norm.
license = "MIT OR Apache-2.0"
repository = "https://github.com/Slurp9187/age-pq-workspace"
homepage = "https://github.com/Slurp9187/age-pq-workspace"
authors = ["Slurp9187"]
description = "Post-quantum age/rage crates"
keywords = ["age", "rage", "hpke", "post-quantum", "plugin"]
categories = ["cryptography"]
include = [
    "examples/**/*.rs",
    "src/**/*.rs",
    "/CHANGELOG.md",
    "/LICENSE*",
    "/README.md",
]


# Optional: if any other crate depends on one of the others via git, add more patches here.

# `panic = "unwind"` is stated explicitly rather than left to the default: it is a
# security property, not a preference. `panic = "abort"` skips destructors, which
# skips secure-gate's zeroization, so a secret would survive in memory past a
# panic. Spelling it out means a later size-motivated switch to "abort" has to be
# a deliberate edit of this line.

[profile.dev]
opt-level = 2   # crypto math is painfully slow in unoptimized debug builds
panic = "unwind"

[profile.release]
panic = "unwind"

[profile.bench]
debug = true    # keep symbols for flamegraphs / profiling

# Shared workspace lint tables need Cargo 1.74+, which the 1.85 floor now clears.
#
# These are inert unless each member opts in with `[lints] workspace = true` —
# the mistake the pre-1.70 version of these tables made, which is why all three
# member manifests now carry that line.
#
# `unsafe_code = "forbid"` is the load-bearing entry: CLAUDE.md has always
# claimed `#![forbid(unsafe_code)]` at every crate root "no exceptions", but
# only `age-pq-hpke` actually carried the attribute. Setting it here makes the
# rule true for all three crates and enforced by the build rather than by
# documentation. Cost is zero: every `unsafe` token in the workspace is itself
# a `#![forbid(unsafe_code)]` attribute — four of them, one per crate root plus
# one in a test target. Belt and braces: the attributes catch it at the file,
# this table catches a crate that forgets one.
#
# Deliberately NOT here: the clippy cast lints (`cast_possible_truncation` and
# friends). They fire on the `usize as u16` RFC 9180 length prefixes in
# `age-pq-hpke`, which are wire-format-adjacent — fixing them is real work that
# belongs in its own change, not riding along in a dependency bump whose whole
# constraint is that the wire format must not move. Tracked separately rather
# than blanket-allowed, because a crate-level `#![allow]` would put these tables
# straight back into the decorative state they were in before.
[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"

[workspace.dependencies]
# 0.9.0-rc.12: edition 2024, rust-version 1.85. The `release/0.8` backport line
# existed solely to hold MSRV 1.70 and is retired.
#
# REGISTRY, EXACT-PINNED, and both halves are deliberate.
#
# Was `{ git = "...", branch = "main" }`, which is wrong for a public repo
# cutting tags. A branch pin puts the whole guarantee in `Cargo.lock`: the lock
# holds a rev until someone runs `cargo update`, and then it silently takes
# whatever landed upstream. Worse for a *tagged release* — the rev a tag's
# lockfile names has no version identity, need never correspond to any published
# secure-gate, and stops existing entirely if that branch is ever rebased or
# force-pushed. Anyone building from our tag would be resolving an in-flight
# commit. This workspace has already watched a consumer get burned by a pin that
# silently stopped tracking upstream (see the rename note in CLAUDE.md); a
# registry version is an immutable, published, auditable fact instead.
#
# `=` rather than a range: the 0.9.0-rc line is pre-release and still moving, so
# a range would let a `cargo update` walk onto an rc nobody here has run the
# CCTV vectors or D1-D5 against. Bumping is a deliberate edit of this line.
#
# Pre-release requirement syntax, which is a trap on this line: a caret matches
# a pre-release only when the requirement itself carries one. `"0.9.0-rc"` would
# track the line and `"=0.9.0-rc.12"` pins it — plain `"0.9"` resolves to
# NOTHING, because there is no stable 0.9.x.
#
# Equivalence to what was tested, measured rather than assumed: the only `src/`
# difference between published v0.9.0-rc.12 and secure-gate's `main` at
# 43a7b4f5 (which this workspace's full suite ran against) is `#[cfg(doc)]
# extern crate std;`, an intra-doc-link fix that is inert outside rustdoc.
# Everything else on main past the tag is docs, tests and the version bump.
secure-gate = { version = "=0.9.0-rc.12", features = ["rand", "ct-eq"] }

# Was `=4.4.18`: genuine MSRV-1.70 scaffolding (clap 4.5.0 moved to 1.74).
# The floor is 1.85 now and clap 4.6 declares exactly 1.85, so the cap is spent.
clap = { version = "4", features = ["derive"] }

# Was `=1.5.0`. Never MSRV scaffolding — 1.5, 1.6 and 1.7 all declare <= 1.66,
# well under the old 1.70 floor. It was blanket exact-pin style, so relaxing it
# costs nothing.
#
# It buys nothing yet either, and deliberately so: relaxing a requirement does
# not re-resolve an already-locked package, so `Cargo.lock` still holds proptest
# 1.5.0 and `cargo tree -i rand@0.8.5` still lists it beside `age` 0.11 and
# `age-core` 0.11. Nor would updating it dedup `rand`: the first proptest off
# `rand 0.8` is 1.7, which takes `rand 0.9` — a different duplicate, not one
# fewer, since our own crates are on 0.10. Same for the two relaxations above:
# the lock still holds clap 4.4.18 and tempfile 3.10.1. A future `cargo update`
# is the first thing that exercises any of these ranges.
proptest = "1"

# Was `=3.10.1`. Never MSRV scaffolding either — tempfile has declared
# rust-version 1.63 continuously from 3.10.0 through 3.27.0.
tempfile = "3"

# The one cap that OUTLIVES the 1.70 line, so it stays: time 0.3.46+ requires
# rustc 1.88, above this workspace's 1.85 floor. Verified against the crates.io
# index rather than assumed — 0.3.41 declares 1.67.1, 0.3.42 declares 1.81,
# 0.3.45 declares 1.83, and 0.3.46 through 0.3.49 declare 1.88.
#
# Resolver 3 prefers a compatible version but is only a preference —
# `--ignore-rust-version`, or a consumer
# resolving this tree with a higher toolchain, walks straight past it. A
# manifest cap is a fact. `age-plugin-pq` inherits this entry rather than
# declaring `time` itself, so the cap actually governs the whole graph.
time = { version = ">=0.3.40, <0.3.46", features = ["formatting", "parsing"] }
