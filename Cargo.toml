[workspace]
members = ["age-pq-hpke", "age-pq-keys", "age-plugin-pq"]
resolver = "2"   # MSRV 1.70 → resolver 2 is required. LAST 1.70 RELEASE: move to "3" with the 1.85 bump.

# Shared package metadata (inherited by every member)
[workspace.package]
# Experimental crates, distributed by git tag. Never published to crates.io, and
# `publish = false` makes that a hard error rather than a convention: `cargo
# publish` and `cargo package --list` refuse instead of half-succeeding.
publish = false

# One version for all three crates. They are one release: `age-pq-keys` layers
# on `age-pq-hpke` and `age-plugin-pq` exposes `age-pq-keys`, distribution is a
# single git tag over the whole workspace, and a consumer pinning
# `tag = "v0.1.0-rc.1"` gets all three at once. Per-crate numbers would give
# that tag three answers to "which version is this?".
version = "0.1.0-rc.1"

rust-version = "1.70"
edition = "2021"
# Confirmed against the LICENSE-MIT / LICENSE-APACHE files in the repository
# root and in each crate, not assumed: dual MIT / Apache-2.0, at the user's
# option, which is the Rust ecosystem norm.
license = "MIT OR Apache-2.0"
repository = "https://github.com/Slurp9187/age-pq-workspace"
homepage = "https://github.com/Slurp9187/age-pq-workspace"
authors = ["Slurp9187"]
description = "Post-quantum age/rage crates"
keywords = ["age", "rage", "hpke", "post-quantum", "plugin"]
categories = ["cryptography"]
include = [
    "examples/**/*.rs",
    "src/**/*.rs",
    "/CHANGELOG.md",
    "/LICENSE*",
    "/README.md",
]


# Optional: if any other crate depends on one of the others via git, add more patches here.

# `panic = "unwind"` is stated explicitly rather than left to the default: it is a
# security property, not a preference. `panic = "abort"` skips destructors, which
# skips secure-gate's zeroization, so a secret would survive in memory past a
# panic. Spelling it out means a later size-motivated switch to "abort" has to be
# a deliberate edit of this line.

[profile.dev]
opt-level = 2   # crypto math is painfully slow in unoptimized debug builds
panic = "unwind"

[profile.release]
panic = "unwind"

[profile.bench]
debug = true    # keep symbols for flamegraphs / profiling

# Shared workspace lint tables require Cargo 1.74+; omitted so `cargo +1.70` stays warning-free.

[workspace.dependencies]
# The 0.8.0-rc.* line is the MSRV-1.70 backport of secure-gate's `main`.
# With the 1.85 bump, move to mainline 0.9.x (edition 2024, rust-version 1.85).
#
# Git source: rc.12 is not on crates.io. That is fine here — these crates are
# experimental and distributed by git tag, never published to crates.io (see
# `publish = false` above), so a git dependency costs nothing. Cargo.lock pins
# the exact rev regardless of the branch.
secure-gate = { git = "https://github.com/Slurp9187/secure-gate", branch = "release/0.8", features = ["rand", "ct-eq"] }

clap = { version = "=4.4.18", features = ["derive"] }

# half 2.5.0+ requires rustc 1.81 (transitive via secure-gate); cap to stay at 1.70 MSRV.
# Removable at MSRV 1.85.
half = { version = ">=2.0, <2.5", default-features = false }

# unicode-ident 1.0.23+ requires rustc 1.71; cap to stay at 1.70 MSRV.
# Removable at MSRV 1.85.
unicode-ident = ">=1.0, <1.0.23"

proptest = "=1.5.0"
tempfile = "=3.10.1"
time = { version = "=0.3.40", features = ["formatting", "parsing"] }
